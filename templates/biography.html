<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="author" content="{{ config.author }}">
		<title>{{ config.title }}</title>
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<meta name="generator" content="zola">
		<link rel="icon" href="{{ get_url(path='favicon.svg', trailing_slash=false) | safe }}">
		<link rel="manifest" href="manifest.webmanifest">
		<link rel="stylesheet" href="{{ get_url(path='page.css', trailing_slash=false) | safe }}">
	</head>

	<body>
		<div id="page-wrap">
			<header>
				<h2>{{ page.title }}</h2>
			</header>
			<main>
				<article>
					{{ page.content | safe }}
				</article>
			</main>
			<aside>
				{%- if page.extra.sources -%}
				<section>
					<h2>References</h2>
					<ul>
						{% for source in page.extra.sources %}
						<li>{{ source }}</li>
						{% endfor %}
					</ul>
				</section>
				{%- endif -%}
			</aside>
		</div>
		<!-- This json could be an include? -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org/",
				"@type": "Article",
			    "wordCount": {{ page.word_count }}
				"about": {
					"@type": "Person",
					"name": "{{ page.title }}",
					{% if page.extra.birth and page.extra.birth is number %}
					"birthDate": "{{ page.extra.birth }}",
					{% endif %}
					{% if page.extra.death and page.extra.death is number %}
					"deathDate": "{{ page.extra.death }}",
					{% endif %}
				}
			}
		</script>
		<script type="speculationrules">speculation_rules.json</script>
	</body>
</html>
